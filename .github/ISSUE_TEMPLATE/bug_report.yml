name: Bug report
description: Something doesn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check the [Troubleshooting](https://github.com/Cloakyi/solid-self/wiki/Troubleshooting) page and the [existing issues](https://github.com/Cloakyi/solid-self/issues) first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem as clearly as possible.
      placeholder: My player is still see-through when ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable shader ...
        2. Switch to third person
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Solid Self version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: "26.2"
    validations:
      required: true
  - type: input
    id: iris-version
    attributes:
      label: Iris and Sodium versions
      placeholder: "Iris 1.11.4, Sodium 0.9.2"
  - type: input
    id: shader
    attributes:
      label: Shader pack and version
      placeholder: "Complementary Reimagined r5.0"
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: List your other mods, or at least the ones that change rendering or player models.
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: Upload `logs/latest.log` or paste a link to it (e.g. on mclo.gs).
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag files into this field.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using the latest version of Solid Self.
          required: true
        - label: I searched the existing issues and didn't find a duplicate.
          required: true
